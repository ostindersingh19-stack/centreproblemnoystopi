<section class="cta">
    <div class="cta-box">
        <h2>Запишитесь на приём</h2>
        <p>Оставьте заявку — мы свяжемся с вами и подберём удобное время.</p>

        <form class="cta-form">
            <input type="text" placeholder="Ваше имя" autocomplete="name" required>
            <input type="tel" placeholder="Телефон" autocomplete="tel" required>
            <button type="submit">Оставить заявку</button>
        </form>
    </div>
</section>
